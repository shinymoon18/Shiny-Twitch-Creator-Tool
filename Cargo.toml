[package]
name = "audio-twitch-cut"
version = "1.4.0"
edition = "2021"
description = "Shiny Twitch Creator Tool: alert, audio, and video editor"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "=1.1.11"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
semver = "1"
sha2 = "0.10"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = "thin"
