[package]
name = "audio-twitch-cut"
version = "1.2.1"
edition = "2021"
description = "Shiny Twitch Creator Tool: alert, audio, and video editor"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "=1.1.11"

[profile.release]
strip = true
lto = "thin"
